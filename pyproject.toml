[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling>=1.10",
]

[project]
name = "python-doi"
version = "0.2.0"
description = "Python package to work with Document Object Identifiers (DOIs)"
readme = "README.rst"
keywords = [
    "doi",
]
license = { text = "GPL-3.0-or-later" }
maintainers = [{ name = "Alejandro Gallo", email = "aamsgallo@gmail.com" }]
authors = [{ name = "Alejandro Gallo", email = "aamsgallo@gmail.com" }]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.optional-dependencies]
develop = [
    "flake8",
    "flake8-bugbear",
    "Flake8-pyproject",
    "flake8-quotes",
    "mypy>=0.7",
    "pep8-naming",
    "pytest",
    "pytest-cov",
    "python-coveralls",
]
docs = [
    "sphinx>=4",
    "sphinx_rtd_theme>=1",
]
# For solving client-side challenges on DDoS-protected sites
# (eg those using CloudFlare)
challenges = [
    "cloudscraper",
]

[project.urls]
Repository = "https://github.com/papis/python-doi"

[tool.hatch.build.targets.sdist]
exclude = [".github", "docs/build"]

[tool.hatch.build.targets.wheel]
packages = ["src/doi"]

[tool.flake8]
select = ["B", "D", "E", "F", "N", "Q", "W"]
extend-ignore = ["B019", "E123", "N818", "W503"]
max-line-length = 88
inline-quotes = "double"
multiline-quotes = "double"

[tool.pytest.ini_options]
addopts = [
    "--doctest-modules",
    "--cov=src/doi",
    "--ignore=docs",
]
markers = [
    "net: marks tests that call use the net"
]

[tool.mypy]
strict = true
show_column_numbers = true
hide_error_codes = false
pretty = true
warn_unused_ignores = false
